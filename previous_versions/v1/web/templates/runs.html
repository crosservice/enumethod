{% extends "base.html" %}
{% block title %}Past Runs — enumethod{% endblock %}
{% block body %}
<div class="container">
  <h1>Past Runs</h1>
  <table id="runs-table">
    <thead>
      <tr>
        <th>#</th>
        <th>Target</th>
        <th>Domain</th>
        <th>Status</th>
        <th>Step</th>
        <th>Started</th>
        <th>Finished</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="runs-body"></tbody>
  </table>
  <p class="empty-state" id="empty" style="display:none;">No runs yet. Start one from the Dashboard.</p>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/runs.js') }}"></script>
{% endblock %}

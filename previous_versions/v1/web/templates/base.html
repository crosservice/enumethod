<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}enumethod{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  {% if session.get('logged_in') %}
  <nav>
    <a class="brand" href="/">enumethod</a>
    <div class="links">
      <a href="/">Dashboard</a>
      <a href="/runs">Past Runs</a>
      <a href="/settings">Settings</a>
      <a href="/logout">Logout</a>
    </div>
  </nav>
  {% endif %}
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
